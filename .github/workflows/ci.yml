name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # El emulador de Firestore necesita Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm i -g firebase-tools@15.22.4
      - run: npm run test:rules
